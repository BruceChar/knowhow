[project]
name = "knowhow"
version = "0.2.0"
description = "AI sales knowledge workspace for small and medium exporters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.159.1",
  "jieba>=0.42.1",
  "openai>=2.0.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.20",
  "segno>=1.6.0",
  "sentence-transformers>=3.0.0",
  "uvicorn[standard]>=0.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
knowhow = "knowhow.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/knowhow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

