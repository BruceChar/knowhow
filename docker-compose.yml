services:
  db:
    image: pgvector/pgvector:pg18
    container_name: rag_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag_dev_2026
      POSTGRES_DB: rag
    ports:
      - "5433:5432"          # 本机 5432 已被原生 PostgreSQL 占用，改用 5433
    volumes:
      - pgdata:/var/lib/postgresql    # PG18+ 要求挂载该目录（数据落在子目录）
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://rag:rag_dev_2026@db:5432/rag
      EMBEDDING_MODEL: bge-m3
      LLM_BASE_URL: https://api.deepseek.com/v1   # 模型中立，可替换
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: deepseek-chat
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data     # 证据文件挂载

volumes:
  pgdata: