services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: knowhow
      POSTGRES_PASSWORD: knowhow_dev
      POSTGRES_DB: knowhow
    ports:
      - "5433:5432"
    volumes:
      - knowhow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knowhow -d knowhow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      KNOWHOW_DATABASE_URL: postgresql://knowhow:knowhow_dev@db:5432/knowhow
      KNOWHOW_SECRET: ${KNOWHOW_SECRET:-change-me-before-production}
      KNOWHOW_COOKIE_SECURE: ${KNOWHOW_COOKIE_SECURE:-0}
      KNOWHOW_LLM_BASE_URL: ${KNOWHOW_LLM_BASE_URL:-}
      KNOWHOW_LLM_API_KEY: ${KNOWHOW_LLM_API_KEY:-}
      KNOWHOW_LLM_MODEL: ${KNOWHOW_LLM_MODEL:-}
      HF_HUB_OFFLINE: "1"
      HF_HOME: /app/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
    volumes:
      - knowhow_models:/app/models

volumes:
  knowhow_pgdata:
  knowhow_models:

